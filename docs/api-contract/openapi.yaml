            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [revise, portalRevise]
                  description: 'portalRevise만 별도 분기이고 그 밖의 값·미전달은 revise로 접힌다.'
      responses:
        '200':
          description: 획득(또는 같은 탭 재획득) — {ok:true} 1키.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          description: >-
            **두 의미가 같은 상태코드를 쓴다**: 세션 없음/무효는 reason:'unauthenticated',
            다른 보유자와의 잠금 충돌은 reason:'locked'다. 상태코드가 아니라 사유 토큰으로 구분하라.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: "{ok:false, reason:'forbidden'} — DPS 기사에 대한 비-D 세션(R·Z)의 편집 진입"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "{ok:false, reason:'not-found'} — 기사 없음(권한·잠금 판정보다 앞선다)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
