        인증된 세션이면 비-DPS 기사는 R/D/Z 누구나 잠글 수 있다. **DPS(송고 완결) 기사의 편집
        진입은 D 전용**이다(고침/포털고침 — editDps capability. Z도 거부되어 403 forbidden).
        body의 `action`은 'portalRevise'면 포털고침, 그 밖의 값·미전달은 모두 'revise'로 접힌다
        (두 분기 모두 같은 D 게이트를 통과한다).
        잠금 획득은 **상태 전이를 일으키지 않는다**(DPS 기사를 잠가도 status는 DPS 그대로다).
        보유자 식별자는 `x-edit-client`(편집 탭)다. 획득 규칙:
        같은 탭 재획득(F5) 허용 · 같은 사용자의 다른 세션(재로그인) takeover 허용 ·
        그 외(다른 사용자, **같은 세션의 다른 탭** 포함)는 거부 · lockedAt이 30분 넘게 갱신되지
        않은 stale 잠금은 누구나 가져간다.
        **거부 상태코드에 주의**: 잠금 충돌은 409도 423도 아닌 **401 locked**다
        (전역 STATUS_BY_REASON.locked=401. server/index.js 629행 주석의 "409"는 코드 내부 주석
        드리프트이며 실값은 401이다. 로그인의 계정 잠금 423은 라우트 로컬 매핑으로 별개다).
        성공 응답은 {ok:true} 뿐이며 누가 잠갔는지·어느 탭인지는 담기지 않는다.
        잠금 상태는 조회 응답의 lockYN='Y' · lockerUserId · lockedAt으로만 드러나고
        lockerSessionId·lockerClientId는 **어떤 응답에도 없다**(권한 상승·탭 사칭 재료).
      security:
        - sessionCookie: []
        - sessionHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/EditClientHeader'
      requestBody:
        required: false
        content:
