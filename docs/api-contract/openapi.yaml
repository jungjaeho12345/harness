                $ref: '#/components/schemas/ErrorResponse'
  /api/articles/{id}/lock:
    x-express-path: '/api/articles/:id/lock'
    post:
      operationId: articlesLock
      tags: [locks]
      summary: 편집 잠금 획득(탭 단위)
