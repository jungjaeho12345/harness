      tags: [articles]
      summary: 기사 이력 목록(본문 blob 없음)
      description: >-
        append-only 원장(ArticleHistory)의 읽기. **이력이 없어도, 기사 자체가 없어도 404가 아니라
        200 빈 배열**이다(기사 생성은 이력 행을 남기지 않으므로 갓 만든 기사도 items:[]).
        행은 본문(markupVersion)을 싣지 않고 존재 여부만 `hasSnapshot`(불리언이 아니라 **정수 1/0**)로
        준다. 저장 컬럼 snapshotTitle은 응답에 나오지 않고 파생 키 `title`로만 나온다.
        파생 3키(title·version·status): version은 1-base이고 최초 저장 본문이 v1이라 첫 편집
        스냅샷 행은 v2다. status는 전이 행이면 toStatus, 전이 이전 구간 행은 가장 오래된 전이의
        fromStatus로 역승계한다. 정렬은 id DESC(최신순)다.
        송고 이력 필터(sendOnly 판정, server/index.js 828~830행): `type=send`이거나
        `sendOnly` 값이 undefined·'0'·'false'가 **아니면** 참이다 —
        `?sendOnly=1`·`?sendOnly=`(빈 값)·`?sendOnly=no`는 전부 필터 ON,
        `?sendOnly=0`·`?sendOnly=false`만 필터 OFF다. 필터 ON이면 eventType='status' AND
        action='send' 행만 남는다.
      security:
        - sessionCookie: []
        - sessionHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: sendOnly
          in: query
          required: false
          schema: { type: string }
          description: undefined·'0'·'false'가 아니면 참(빈 문자열도 참).
        - name: type
          in: query
          required: false
          schema: { type: string }
          description: 값이 'send'면 sendOnly와 동일하게 참(sendOnly=0과 함께 와도 참이 이긴다).
      responses:
        '200':
          description: >-
            이력 목록. 봉투 {ok, items} 2키. 행은 12키 고정(action, actorUserId, articleId,
            createdAt, eventType, fromStatus, hasSnapshot, id, status, title, toStatus, version).
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok: { const: true }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryListRow'
        '401':
          description: 세션 없음/무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
