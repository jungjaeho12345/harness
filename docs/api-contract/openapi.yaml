# 기사 작성기 REST/SSE 계약 — OpenAPI 3.1 실측 스냅샷 (phase 67).
# 코드가 정본이다(server/index.js + src/services/**) — 불일치 시 이 문서를 코드에 맞춘다.
# 기계 게이트의 입력은 endpoints.json이다(decisions (3)) — 이 YAML은 사람·Spring 도구용이며
# 자동 판정은 "인벤토리의 모든 method+path 문자열이 존재하는가"(scripts/contract-inventory-check.mjs)까지다.
openapi: 3.1.0
info:
  title: 기사 작성기 API (계약 동결 스냅샷)
  version: 1.0.0
  description: >-
    코드가 정본이며 이 문서는 실측 스냅샷이다(2026-08-19, phase 67).
    39 라우트(REST 37 + SSE 2)의 계약을 동결한다. 측정 조건: SPA_DIR 미설정 ·
    외부 API 키 미설정 · .env 미로드 · NODE_ENV 미설정(prod-cookie 프로파일 제외).
    상태코드로 성공을 판정할 수 없다 — 200인데 ok:false인 graceful 응답이 존재한다(번역).
servers:
  - url: http://127.0.0.1:3001
    description: 예시 — 계약 스위트는 CONTRACT_BASE_URL로만 서버를 가리킨다
tags:
  - name: auth
    description: 로그인/로그아웃/세션 복원
  - name: users
    description: 사용자 관리(Z) + 명단 조회
  - name: receiver-config
    description: 수집 수신 설정(Z 전용)
  - name: articles
    description: 기사 조회/검색/작성/수정/전이/파생/번역/이력
  - name: locks
    description: 편집 잠금(lock/unlock/force-unlock)
  - name: media
    description: 미디어 검색 프록시 · 업로드 · 사진DB
  - name: collection
    description: 수집 인제스트(receive/pull — 토큰·loopback)
  - name: distribution
    description: 배부 수신처 CRUD · tick · 실패/재전송(Z 전용, ADR-008)
  - name: stream
    description: SSE(무효화 신호 스트림 · Z 전용 로그 스트림) + 로그 다이제스트
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: >-
        로그인 시 발급되는 64-hex 세션 토큰 쿠키. HttpOnly · Path=/ · Max-Age=3600 ·
        비프로덕션 SameSite=Lax / 프로덕션 Secure; SameSite=None. 판독은 쿠키 우선.
    sessionHeader:
      type: apiKey
      in: header
      name: x-session-id
      description: 세션 토큰의 헤더 폴백(쿠키가 없을 때). 쿼리스트링 폴백은 없다.
    collectionToken:
      type: apiKey
      in: header
      name: x-collection-token
      description: >-
        수집 인제스트 전용(COLLECTION_TOKEN 설정 시 필수). 세션과 무관하다.
        비-loopback 바인딩 + 토큰 미설정이면 수집 라우트는 503 collection-disabled(fail-closed).
  parameters:
    # x-edit-client는 인증 수단이 아니라 편집 탭(잠금 보유자) 식별자다 — securityScheme이 아니라
    # 파라미터로 둔다. 인가는 항상 "검증된 세션의 userId + 이 값" 대조다(헤더 단독 인가 금지, ADR-004).
    EditClientHeader:
      name: x-edit-client
      in: header
      required: false
      schema:
        type: string
      description: 편집 탭 식별자(잠금 보유자 판정) — lock/unlock/PUT 기사 수정에서 사용.
  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          const: true
    ErrorResponse:
      type: object
      required: [ok, reason]
      properties:
        ok:
          const: false
        reason:
          type: string
          description: 고정 사유 토큰 — 매핑 전수는 reason-tokens.md(표 1·2·3 합집합 39종).
          enum:
            - unauthenticated
            - invalid-credentials
            - inactive
            - forbidden
            - not-holder
            - not-dps
            - not-found
            - locked
            - forbidden-transition
            - unknown-role
            - no-end-marker
            - unknown-action
            - unknown-mode
            - unknown-capability
            - unregistered
            - spool-disabled
            - tick-failed
            - no-failure
            - status-changed
            - kind-changed
            - stale-cycle
            - retry-in-flight
            - invalid-file
            - too-large
            - invalid-src
            - spool-write-failed
            - invalid-spool-dir
            - invalid-article-id
            - collection-disabled
            - forbidden-origin
            - internal-error
            - invalid-name
            - invalid-kind
            - invalid-active
            - duplicate-spool-dir
            - no-active-api-source
            - fetch-failed
            - no-key
            - error
    ContentsRow:
      type: object
      description: >-
        Contents 행의 응답 투영(contentsProjection.toPublicContents 통과 후).
        lockerSessionId·lockerClientId 컬럼은 어떤 응답에도 **없다**(세션 토큰 원문·편집 탭
        식별자 = 권한 상승 재료 — PRIVATE_CONTENTS_COLS 단일 출처). 시간은 ISO-8601 UTC 문자열.
      properties:
        articleId: { type: string }
        title: { type: [string, "null"] }
        content: { type: [string, "null"], description: 평문 컬럼 — 현재 미사용 }
        author: { type: [string, "null"] }
        modifier: { type: [string, "null"] }
        sender: { type: [string, "null"] }
        department: { type: [string, "null"] }
        departmentCode: { type: [string, "null"] }
        createdAt: { type: [string, "null"] }
        editedAt: { type: [string, "null"] }
        sentAt: { type: [string, "null"] }
        distributedAt: { type: [string, "null"], description: 스풀 기록 시각 = 배부 지시 완료(발송 완료 아님, ADR-008) }
        embargoAt: { type: [string, "null"] }
        secondEmbargoAt: { type: [string, "null"] }
        status:
          type: string
          enum: [RDS, DPS, RRH, RRK, DDH, DDK, DPD, DES, EPS, EEK, EEH]
        lockYN: { type: [string, "null"], enum: [Y, N, null] }
        lockerUserId: { type: [string, "null"], description: 잠금 표시 UI 계약 — 노출 유지 }
        lockedAt: { type: [string, "null"] }
        coAuthor: { type: [string, "null"] }
        region: { type: [string, "null"] }
        attribute: { type: [string, "null"] }
        keyword: { type: [string, "null"] }
        internalComment: { type: [string, "null"] }
        externalComment: { type: [string, "null"] }
        attachmentFile: { type: [string, "null"] }
        referenceFile: { type: [string, "null"] }
    Article:
      type: object
      description: Article 행(본문 마크업 담당) — GET /api/articles/:id의 article 키.
      properties:
        articleId: { type: string }
        title: { type: [string, "null"] }
        content: { type: [string, "null"], description: 평문 컬럼 — 현재 미사용 }
        markupVersion:
          type: [string, "null"]
          description: '블록 JSON 직렬화 문자열 — {"format":"yh-editor","version":1,"blocks":[...]}'
        modifier: { type: [string, "null"] }
    HistoryRow:
      type: object
      description: >-
        ArticleHistory 행(append-only 원장). 목록(GET /api/articles/:id/history)은 본문 blob 없이
        hasSnapshot 파생 필드를 싣고, 본문은 단건 스냅샷 라우트로 지연 조회한다.
      properties:
        id: { type: integer }
        articleId: { type: string }
        eventType:
          type: string
          enum: [create, edit, status, distribute, distribute-failed, distribute-retry]
        action: { type: [string, "null"], description: status=send|hold|kill|approveDelete|embargo / distribute=press|nonpress }
        fromStatus: { type: [string, "null"] }
        toStatus: { type: [string, "null"] }
        actorUserId: { type: [string, "null"] }
        createdAt: { type: [string, "null"] }
        snapshotTitle: { type: [string, "null"] }
        targetId: { type: [integer, "null"], description: 배부 실패/재전송 이벤트의 수신처 id — 그 외 NULL }
        reason: { type: [string, "null"], description: 배부 실패 고정 토큰 — 경로·본문·예외 원문 없음 }
        hasSnapshot: { type: boolean, description: 목록 조회의 파생 필드(본문 스냅샷 존재 여부) }
    User:
      type: object
      description: Z 조회·로그인 응답의 사용자(SAFE_FIELDS) — password·잠금 필드(failedLoginCount 등)는 어떤 응답에도 없다.
      properties:
        userId: { type: string }
        name: { type: [string, "null"] }
        role: { type: string, enum: [R, D, Z] }
        department: { type: [string, "null"] }
        departmentCode: { type: [string, "null"] }
        active: { type: [string, "null"], enum: [Y, N, null] }
    UserPublic:
      type: object
      description: 비-Z의 GET /api/users 투영(정확 4필드).
      properties:
        userId: { type: string }
        name: { type: [string, "null"] }
        department: { type: [string, "null"] }
        departmentCode: { type: [string, "null"] }
    DistributionTarget:
      type: object
      description: 배부 수신처(ADR-008) — 행 삭제 없음(deactivate soft delete만).
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [press, nonpress] }
        spoolDir: { type: string, description: 스풀 하위 폴더 슬러그 }
        active: { type: string, enum: [Y, N] }
        createdAt: { type: [string, "null"] }
        updatedAt: { type: [string, "null"] }
    ReceiverConfig:
      type: object
      description: 수집 수신 설정의 응답 투영(SAFE_FIELDS 10키) — password·apiKey는 쓰기 전용 시크릿으로 어떤 응답에도 없다.
      properties:
        id: { type: integer }
        sourceId: { type: [string, "null"] }
        type: { type: [string, "null"], enum: [FTP, API, null] }
        name: { type: [string, "null"] }
        host: { type: [string, "null"] }
        port: { type: [string, "null"] }
        apiEndpoint: { type: [string, "null"] }
        active: { type: [string, "null"], enum: [Y, N, null] }
        createdAt: { type: [string, "null"] }
        username: { type: [string, "null"] }
# --- step4 ---
# 아래 2개는 components/schemas 아래에 추가해야 한다(step0의 HistoryRow는 **DB 컬럼** 스키마이고,
# 이 2개는 실제 응답 투영이다 — 목록은 snapshotTitle·markupVersion을 싣지 않고 파생 3키를 더한다).
    HistoryListRow:
      type: object
      description: >-
        GET /api/articles/:id/history의 행(실측 12키 고정). 모델 8컬럼 + hasSnapshot(정수 1/0) +
        파생 3키(title·version·status). 본문(markupVersion)과 저장 컬럼 snapshotTitle은 싣지 않는다.
      required: [id, articleId, eventType, action, fromStatus, toStatus, actorUserId, createdAt, hasSnapshot, title, version, status]
      properties:
        id: { type: integer }
        articleId: { type: string }
        eventType:
          type: string
          enum: [edit, status, distribute, distribute-failed, distribute-retry]
        action: { type: [string, "null"], description: "status 행=send|hold|kill|approveDelete|embargo / edit 행=null" }
        fromStatus: { type: [string, "null"], description: 전이 행만 값이 있다 }
        toStatus: { type: [string, "null"], description: 전이 행만 값이 있다 }
        actorUserId: { type: [string, "null"] }
        createdAt: { type: [string, "null"] }
        hasSnapshot:
          type: integer
          enum: [0, 1]
          description: 본문 스냅샷 존재 여부 — 불리언이 아니라 SQL CASE 산출 정수다.
        title: { type: string, description: "표시용 제목(저장된 파생 제목 우선, 없으면 본문 첫 텍스트 줄). 값 없으면 ''" }
        version: { type: integer, description: 1-base. 최초 저장 본문이 v1이므로 첫 편집 스냅샷 행은 2다 }
        status: { type: string, description: "전이 행=toStatus, 전이 이전 구간=가장 오래된 전이의 fromStatus 역승계. 없으면 ''" }
    HistorySnapshotItem:
      type: object
      description: >-
        GET /api/articles/:id/history/:historyId의 item(실측 7키). 목록 행과 달리 본문을 싣고
        전이 컬럼(fromStatus·toStatus)과 hasSnapshot은 없다.
      required: [id, articleId, eventType, action, actorUserId, createdAt, markupVersion]
      properties:
        id: { type: integer }
        articleId: { type: string }
        eventType: { type: string }
        action: { type: [string, "null"] }
        actorUserId: { type: [string, "null"] }
        createdAt: { type: [string, "null"] }
        markupVersion:
          type: [string, "null"]
          description: 스냅샷 본문. 스냅샷이 없는 전이 행을 조회하면 null이다(그래도 200).

# --- step5 ---
# 아래 4개는 components/schemas 아래에 추가한다(step0 뼈대에는 요청 스키마가 없다).
# 요청 2종의 공통 규율: 선언된 키만 저장되고 **나머지 키는 400이 아니라 조용히 무시된다**.
    ArticleCreateRequest:
      type: object
      additionalProperties: true
      description: >-
        POST /api/articles 요청. 저장되는 키는 아래 선언분뿐이다(Article 3키 + Contents 16키 + 의도 action).
        `role`·`status`·`articleId`·`sender`·`sentAt`·`createdAt`·`editedAt`·`distributedAt`·
        `content`·잠금 4컬럼(lockYN·lockerUserId·lockerSessionId·lockerClientId·lockedAt)은
        보내도 무시된다 — 서버가 결정하거나 다른 라우트가 소유한다(ADR-004 신뢰 경계).
      properties:
        title: { type: string }
        markupVersion:
          type: string
          description: '본문 블록 JSON 직렬화 문자열. base64 인라인 이미지 때문에 커질 수 있어 이 라우트만 10mb 파서다.'
        author:
          type: string
          description: 미전송이면 세션 사용자(name, 없으면 userId)로 stamp된다. **명시하면 그 값이 보존된다**.
        modifier: { type: string }
        department:
          type: string
          description: 비면 세션 부서로 stamp된다(departmentCode도 함께).
        departmentCode: { type: string }
        embargoAt: { type: string }
        secondEmbargoAt: { type: string }
        coAuthor: { type: string }
        category: { type: string }
        region: { type: string }
        attribute: { type: string }
        keyword: { type: string }
        internalComment: { type: string }
        externalComment: { type: string }
        attachmentFile:
          type: string
          description: 파일 참조 문자열 — 서버가 스킴 방어 규칙(sanitizeFileRef)으로 정규화한다.
        referenceFile: { type: string }
        action:
          type: string
          enum: [hold, send]
          description: >-
            저장되는 값이 아니라 **초기 status 계산 입력**이다. hold → D·Z는 DDH / R은 RRH.
            그 밖(send·미전달·정의 외)은 전부 RDS다.
    ArticleUpdateRequest:
      type: object
      additionalProperties: true
      description: >-
        PUT /api/articles/{id} 요청(부분 수정 — 보낸 키만 갱신된다).
        저장 키 집합은 create와 같고 `action`은 없다(전이는 action 라우트 전용).
        `modifier`는 보내도 세션 userId로 덮어쓴다. `department`를 빈 값으로 보내면 세션 부서로 보정한다.
      properties:
        title: { type: string }
        markupVersion: { type: string }
        author: { type: string }
        department:
          type: string
          description: 빈 문자열이면 세션 부서·부서코드로 보정된다. 키 자체가 없으면 기존 값 보존.
        departmentCode: { type: string }
        embargoAt: { type: string }
        secondEmbargoAt: { type: string }
        coAuthor: { type: string }
        category: { type: string }
        region: { type: string }
        attribute: { type: string }
        keyword: { type: string }
        internalComment: { type: string }
        externalComment: { type: string }
        attachmentFile: { type: string }
        referenceFile: { type: string }
    ArticleCreateResponse:
      type: object
      required: [ok, articleId]
      properties:
        ok: { const: true }
        articleId:
          type: string
          pattern: '^AKR\d{8}\d{9}$'
          description: 서버 발급 — 'AKR' + 발급일 YYYYMMDD + 난수 9자리(충돌 시 재발급).
    ArticleUpdateResponse:
      type: object
      required: [ok, changes]
      properties:
        ok: { const: true }
        changes:
          type: integer
          description: 갱신된 행 수(Article + Contents). 현행 구현의 고정 관측값은 2다.

# --- step9 ---
# 아래는 components.schemas 아래에 그대로 들어갈 조각이다(스키마 이름 들여쓰기 4칸 — 기존 OkResponse와 동일 레벨).
# 기존 컴포넌트 재사용: ErrorResponse(reason enum에 no-key·error·invalid-file·too-large·invalid-src가 이미 있다).
    TranslateRequest:
      type: object
      description: 번역 옵션. 본문 텍스트는 받지 않는다(서버가 DB에서 취한다 — ADR-004).
      properties:
        targetLang:
          type: string
          default: ko
          description: 목표 언어 코드. 생략 시 서버가 'ko'를 쓴다(키 없는 구성에서는 외부 호출이 없어 사용 여부 관측 불가).
    TranslateResponse:
      type: object
      description: >-
        성공/실패가 같은 200이다. 실패(graceful)여도 translatedText에 **원문**이 담긴다 —
        호출자는 ok만 보고 판정하고, 실패 시 원문을 그대로 보여주면 된다.
      required: [ok]
      properties:
        ok: { type: boolean }
        reason:
          type: string
          enum: [no-key, error]
          description: ok:false일 때만 존재. no-key=키 미설정 / error=외부 호출·응답 파싱 실패.
        translatedText:
          type: string
          description: 성공이면 번역문, 실패면 원문 폴백. 빈 본문 기사는 ok:true + 빈 문자열이다.
        sourceLang:
          type: string
          description: 성공 시에만, 그리고 provider가 감지 언어를 준 경우에만 존재(미검증 — 외부 키 필요).
    MediaImageItem:
      type: object
      description: 이미지 검색 원소(키 미설정 데모 폴백 실측 — 정확히 2키).
      properties:
        title: { type: string }
        link: { type: string, description: 이미지 URL }
    MediaVideoItem:
      type: object
      description: 영상 검색 원소(키 미설정 데모 폴백 실측 — 정확히 3키).
      properties:
        title: { type: string }
        videoId: { type: string, description: 임베드 가능한 11자 YouTube video id }
        url: { type: string }
    MediaSearchResponse:
      type: object
      description: 응답 키 3종 고정. ok는 항상 true이고 실패는 error 플래그로만 표현된다.
      required: [ok, items, error]
      properties:
        ok: { const: true }
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MediaImageItem'
              - $ref: '#/components/schemas/MediaVideoItem'
        error:
          type: boolean
          description: 외부 호출 실패면 true(items는 빈 배열). 키 미설정 데모 폴백은 false다.
    UploadRequest:
      type: object
      required: [filename, contentBase64]
      properties:
        filename:
          type: string
          description: >-
            원본 파일명 — **확장자 판정에만** 쓴다(저장 경로에 반영되지 않는다).
            확장자는 소문자로 비교하며 화이트리스트 14종 밖이면 invalid-file이다.
        contentBase64:
          type: string
          description: 데이터 URI prefix 없는 raw base64. 디코드 후 5,242,880바이트를 넘으면 too-large.
    UploadResponse:
      type: object
      required: [ok, path, filename]
      properties:
        ok: { const: true }
        path:
          type: string
          pattern: '^/uploads/[0-9a-f]{32}\.[a-z]+$'
          description: 서버가 발급한 저장 경로. 이 문자열이 Contents.attachmentFile/referenceFile에 저장된다.
        filename:
          type: string
          description: 요청 filename 원본(대소문자 보존) — 표시용 에코다.
    PhotoCreateRequest:
      type: object
      required: [src]
      properties:
        src:
          type: string
          description: '`/uploads/…` 상대경로 또는 `https://` URL만 허용(그 외 전부 invalid-src).'
        caption: { type: string, description: 검색 대상 텍스트. 생략 시 빈 문자열. }
        sourceArticleId: { type: string, description: 등록 시점 편집 중이던 기사아이디(best-effort). 생략 시 빈 문자열. }
        registeredBy:
          type: string
          deprecated: true
          description: >-
            **무시된다** — 서버가 세션 userId로만 stamp한다(ADR-004). 요청에 넣지 마라.
    PhotoCreateResponse:
      type: object
      required: [ok, id]
      properties:
        ok: { const: true }
        id: { type: integer, description: 새 Photo 행 id(ROWID alias) }
    PhotoRow:
      type: object
      description: Photo 행 전체(SELECT * — 응답 투영·마스킹이 없다).
      properties:
        id: { type: integer }
        src: { type: [string, "null"] }
        caption: { type: [string, "null"] }
        sourceArticleId: { type: [string, "null"] }
        registeredBy: { type: [string, "null"], description: 세션 userId로만 stamp된 값 }
        createdAt: { type: [string, "null"], description: ISO-8601 UTC }
    PhotoSearchResponse:
      type: object
      required: [ok, items]
      properties:
        ok: { const: true }
        items:
          type: array
          items:
            $ref: '#/components/schemas/PhotoRow'

# --- step11 ---
# components.schemas 아래에 추가(기존 항목과 알파벳/등장 순서 무관 — step12가 형식 정합).
    LogRecord:
      type: object
      description: >-
        로그 서비스(src/services/logService.js)의 record — 키 5개가 계약이다(/api/logs/digest의 items 원소이자
        /api/logs/stream의 log 프레임 payload). message·line의 **실값은 어떤 문서·리포트에도 싣지 않는다**(LOGS.md).
      required: [seq, ts, level, message, line]
      properties:
        seq:
          type: integer
          description: 프로세스 수명 동안 단조 증가(evict돼도 재사용 없음) — SSE replay 중복 필터의 근거.
        ts:
          type: integer
          description: epoch ms.
        level:
          type: string
          enum: [DEBUG, INFO, WARN, ERROR]
        message:
          type: string
          description: 마스킹된 메시지(비밀번호·세션 토큰·쿠키/Authorization 값·본문·payload 금지).
        line:
          type: string
          description: '`[YYYY-MM-DD HH:MM:SS] [LEVEL] <message>` (KST=UTC+9 벽시계 고정 오프셋).'

# paths는 step3~step11이 도메인별로 append한다 — 다른 step이 쓴 절은 수정하지 않는다(decisions (18)).
# 아래 /api/health 1건은 후속 step이 따라 쓸 형식 본보기다(요약·설명·응답 스키마 참조 방식).
# health는 9개 도메인 태그 밖의 liveness 프로브다 — 도메인 라우트는 반드시 tags를 명시한다.
# --- step3 ---
# 아래는 components가 아니라 **최상위(들여쓰기 0) 확장 절**이다 — paths 밖, info/servers와 같은 레벨에 둔다.
# (경로가 없는 교차 계약이라 paths에 넣을 수 없다 — step3.md 작업 E.)
# docs/api-contract/README.md에 "교차 계약(CSRF·CORS·쿠키 2변형·로그인 리밋/잠금)은 openapi.yaml의
# 최상위 x-cross-cutting 절에 있다" 한 줄이 필요하다(step3는 README 무접촉 — step12가 반영).
x-cross-cutting:
  description: >-
    경로에 매달 수 없는 미들웨어 축 계약. 측정 조건은 info.description과 같다(SPA_DIR 미설정 · .env 미로드 ·
    NODE_ENV 미설정, prod-cookie 프로파일만 production + FORCE_HTTPS=false).
  sessionTransport:
    order: sid 쿠키 우선 → x-session-id 헤더 폴백
    queryFallback: 없음 — ?session=<유효 토큰>만으로는 401(보안 사유로 제거됨, 부재가 계약)
    singleSessionPerUser: 로그인 성공은 같은 userId의 기존 세션을 전부 무효화한다(이전 토큰 즉시 401)
  sessionCookie:
    name: sid
    value: 64-hex 랜덤 토큰(역할·신원 정보 없음)
    nonProduction: 'HttpOnly; Path=/; Max-Age=3600; SameSite=Lax (Secure 없음)'
    production: 'HttpOnly; Path=/; Max-Age=3600; SameSite=None; Secure'
    clearOnLogout: '동일 속성 + 빈 값 + Max-Age=0'
  csrf:
    scope: 상태 변경 메서드만(GET·HEAD·OPTIONS 제외)
    absentOriginAndReferer: 통과 — 서버-서버/cron 관용(계약 스위트 전체가 이 관용 위에서 돈다)
    refererOnly: Referer의 origin으로 판정한다(허용 출처면 통과, 파싱 불가면 403)
    reject: '403 {ok:false, reason:forbidden-origin}'
    allowlistSource: 비프로덕션 = http://localhost:5173 · http://127.0.0.1:5173 + ALLOWED_ORIGINS / 프로덕션 = ALLOWED_ORIGINS만
    loopbackTolerance: 비프로덕션만(프로덕션에서는 loopback Origin도 미등록이면 403)
  cors:
    credentials: true (와일드카드 origin 금지)
    methods: [GET, POST, PUT, DELETE, OPTIONS]
    allowedHeaders: [Content-Type, x-session-id, x-collection-token, x-edit-client]
    preflightAllowed: '2xx(실측 204) + Access-Control-Allow-Origin=요청 Origin + Access-Control-Allow-Credentials: true'
    preflightForeign: '2xx이지만 Access-Control-Allow-Origin 부재(ACAC는 실림 — 판독 차단은 ACAO 부재가 담당)'
  loginLimits:
    rateLimit: IP 15분/10회 — 초과 시 429(본문 비-JSON, RateLimit-Limit 헤더 동반)
    accountLockout: 사용자 단위 누적 실패 5회 → 15분 잠금, 잠긴 동안은 올바른 비밀번호도 423 locked
    userEnumeration: 미존재 계정과 비밀번호 불일치가 같은 401·같은 토큰(구분 불가)
  errorShapes:
    rule: "거부는 {ok:false, reason:'<토큰>'} JSON이 원칙이다(401에도 바디가 반드시 있다)"
    exceptions:
      - '429(로그인 레이트리밋): text/html 문자열 본문 — 미들웨어가 응답을 만든다'
      - '404(미정의 경로): SPA_DIR 미설정이면 express 기본 HTML 404 — SPA_DIR 설정 시 GET은 index.html 폴백 200이 된다(범위 밖)'

paths:
  /api/health:
    get:
      operationId: health
      summary: 헬스체크
      description: >-
        항상 200 {"ok":true}. 인증 불요. Electron 셸의 서버 주소 프로브가 상태코드가 아니라
        본문 {ok:true}까지 판정하므로 본문 shape이 계약이다.
      security: []
      responses:
        '200':
          description: 서버 생존
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /api/login:
    post:
      operationId: login
      tags: [auth]
      summary: 로그인(세션 발급)
      description: >-
        아이디/비밀번호 대조 후 64-hex 세션 토큰을 발급한다. 토큰은 응답 body(sessionId)와
        Set-Cookie(sid) 두 경로로 동시에 나가며 값이 같다.
        **단일 세션 정책**: 로그인 성공은 같은 userId의 기존 세션을 전부 무효화한다(실측 — 이전 토큰은 즉시 401).
        거부 사유별로 상태가 갈린다: invalid-credentials 401 · inactive 403 · locked **423**(라우트 로컬 매핑이
        전역 401을 덮어쓴다). 사용자 존재 여부는 응답으로 알 수 없다 — 미존재 계정도 존재 계정의 비밀번호
        불일치와 **같은 401 · 같은 invalid-credentials 토큰**이다.
        계정 잠금은 사용자 단위 누적 실패 5회(src/services/userService.js LOCKOUT_THRESHOLD)에서 걸리고
        15분간 유지되며, 잠긴 계정은 **올바른 비밀번호로도** 423이다.
        IP 단위 레이트리밋은 15분/10회(server/index.js loginLimiter)이고 초과 응답은 라우트가 아니라
        미들웨어가 만든다 — x-cross-cutting.errorShapes 참조(JSON이 아니다).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, password]
              properties:
                userId: { type: string }
                password: { type: string, description: 평문 전송(TLS 종단은 외부 프록시 책임) — 응답·로그·리포트에 절대 담기지 않는다 }
      responses:
        '200':
          description: 로그인 성공(응답 키 정확 3종)
          headers:
            Set-Cookie:
              description: >-
                sid=<64-hex>; Max-Age=3600; Path=/; HttpOnly; SameSite=Lax (비프로덕션 실측) /
                프로덕션은 여기에 Secure가 붙고 SameSite=None이다(x-cross-cutting.sessionCookie).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [ok, sessionId, user]
                properties:
                  ok: { const: true }
                  sessionId: { type: string, pattern: '^[0-9a-f]{64}$' }
                  user:
                    $ref: '#/components/schemas/User'
                    description: SAFE_FIELDS 6키(userId,name,role,department,departmentCode,active) — password·잠금 메타 없음
        '401':
          description: invalid-credentials(자격 불일치 · 미존재 계정 동일 응답)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: inactive(비활성 계정) — 시드 계정으로는 도달 불가라 계약 스위트 미동결
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: locked(계정 잠금 5회/15분) — 올바른 비밀번호로도 거부
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >-
            IP 레이트리밋 초과(15분/10회). **본문이 JSON이 아니다** — express-rate-limit 기본 메시지 문자열이
            text/html로 나간다(실측: 'Too many requests, please try again later.').
            RateLimit-Limit: 10 등 draft-6 표준 헤더가 동반한다.
          headers:
            RateLimit-Limit:
              description: 창당 허용 횟수(실측 10)
              schema: { type: string }
          content:
            text/html:
              schema: { type: string }
  /api/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: 로그아웃(세션 무효화 + 쿠키 만료)
      description: >-
        **항상 200 {ok:true}**이다 — 세션이 없거나 토큰이 무효해도 성공이다(멱등).
        토큰 판독 순서는 sid 쿠키 → x-session-id 헤더 → body.sessionId 폴백이다.
        응답은 언제나 만료 쿠키(sid=; Max-Age=0)를 내리며, 쿠키 속성은 발급 시와 같은 조합이다
        (비프로덕션 HttpOnly·Path=/·SameSite=Lax / 프로덕션은 Secure·SameSite=None 추가).
        상태 변경 메서드라 CSRF Origin 게이트의 대상이다 — 교차 출처 Origin/파싱 불가 Referer는
        라우트에 닿기 전에 403 forbidden-origin이다(x-cross-cutting.csrf).
      security:
        - sessionCookie: []
        - sessionHeader: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId: { type: string, description: 쿠키·헤더가 없을 때의 마지막 폴백 판독 경로 }
      responses:
        '200':
          description: 로그아웃(세션 유무 무관)
          headers:
            Set-Cookie:
              description: 'sid=; Max-Age=0; Path=/; HttpOnly; SameSite=Lax (프로덕션은 Secure; SameSite=None)'
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '403':
          description: forbidden-origin(CSRF Origin 게이트 — 라우트 진입 전 거부)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/session:
    get:
      operationId: session
      tags: [auth]
      summary: 세션 복원(F5)
      description: >-
        재인증 없이 현재 신원을 돌려준다. 토큰 판독은 **sid 쿠키 우선 · x-session-id 헤더 폴백**이며
        **?session= 쿼리 폴백은 없다**(유효한 토큰을 쿼리로만 줘도 401 — 누출 표면 제거가 계약이다).
        매 호출 User 행을 재조회해 신원을 재도출한다(비활성·역할 변경 즉시 반영, 슬라이딩 만료 갱신).
        미인증 401에도 **반드시 JSON 바디**가 있다({ok:false, reason:'unauthenticated'}) — SPA가 본문을 읽는다.
        user 객체는 세션 신원 투영이라 **정확히 5키**(userId·name·role·department·departmentCode)이며
        로그인 응답의 6키와 달리 **active가 없다**(실측 — endpoints.json 'session' 행 notes의 6키 표기는 드리프트).
      security:
        - sessionCookie: []
        - sessionHeader: []
      responses:
        '200':
          description: 세션 유효
          content:
            application/json:
              schema:
                type: object
                required: [ok, user]
                properties:
                  ok: { const: true }
                  user:
                    type: object
                    description: 세션 신원 투영(IDENTITY_FIELDS 5키) — password·active 없음
                    required: [userId, role]
                    properties:
                      userId: { type: string }
                      name: { type: [string, "null"] }
                      role: { type: string, enum: [R, D, Z] }
                      department: { type: [string, "null"] }
                      departmentCode: { type: [string, "null"] }
        '401':
          description: unauthenticated(토큰 없음·무효·형식 오류·쿼리 전달·로그아웃 후·재로그인으로 무효화됨)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/articles:
    x-express-path: '/api/articles'
    get:
      operationId: articlesList
      tags: [articles]
      summary: 기사 목록 조회(필터 화이트리스트 13키)
      description: >-
        세션이 있으면 역할과 무관하게 같은 목록을 받는다(역할별 행 필터는 없다 — R/D/Z 실측 동일).
        쿼리는 FILTER_KEYS **13키**만 서버로 전달되고 그 밖의 키는 조용히 무시된다(400이 아니다).
        계획서 부록 A의 "필터 15키"는 드리프트이며 **코드가 정본**이다(server/index.js 380~384행).
        정렬은 createdAt DESC 고정이고 페이징·총 개수 필드는 없다.
        배열이 되는 키는 status·excludeStatus·departments 3종뿐이며 표기는 **반복 키**다
        (`?status=RDS&status=DDH`). 콤마 표기(`?status=RDS,DDH`)는 분해되지 않고 단일 문자열
        'RDS,DDH'로 취급되어 아무것도 매칭하지 않는다 — Spring 기본 바인딩과 정반대이므로 주의.
        부기(실측): Express의 확장 쿼리 파서 때문에 `status[]=DPS`·`status[0]=RDS` 같은 대괄호 표기도
        같은 배열 필터로 동작한다. 이는 파서의 부수 효과이며 정본 표기는 반복 키다(대상 서버가
        대괄호 표기를 지원하지 않아도 계약 위반이 아니다 — 계약 스위트는 반복 키만 단언한다).
        부기(결함 후보): 스칼라 전용 키(articleId·author·sender·department·날짜 6키)를 반복하면
        배열이 그대로 SQL 바인딩으로 내려가 500 internal-error가 난다(고치지 않고 기록만 한다).
        departments와 department를 함께 주면 **departments가 이긴다**(department는 무시).
        날짜 범위는 ISO-8601 문자열의 사전식 비교라 해당 컬럼이 NULL인 행은 범위 필터에서 탈락한다
        (미송고 기사는 sentAtFrom에, 미배부 기사는 distributedAtFrom/To에 절대 걸리지 않는다).
      security:
        - sessionCookie: []
        - sessionHeader: []
      parameters:
        - name: articleId
          in: query
          required: false
          schema: { type: string }
          description: 기사 ID 정확 일치(스칼라 전용 — 반복 시 500).
        - name: author
          in: query
          required: false
          schema: { type: string }
          description: 작성자 정확 일치(스칼라 전용).
        - name: sender
          in: query
          required: false
          schema: { type: string }
          description: 송고자 정확 일치(송고 시 서버가 세션 userId로 stamp한 값 — 스칼라 전용).
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
              - type: array
                items: { type: string }
          description: 상태 IN 필터. 반복 키로 배열을 만든다(`?status=RDS&status=DDH`).
        - name: excludeStatus
          in: query
          required: false
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
              - type: array
                items: { type: string }
          description: 상태 NOT IN 필터. 반복 키 지원.
        - name: department
          in: query
          required: false
          schema: { type: string }
          description: 부서 단일 값(스칼라 전용 — 반복 시 500). departments가 함께 오면 무시된다.
        - name: departments
          in: query
          required: false
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
              - type: array
                items: { type: string }
          description: 부서 IN 필터(반복 키). department보다 우선한다.
        - name: createdAtFrom
          in: query
          required: false
          schema: { type: string }
          description: 'createdAt >= 값 (ISO-8601 문자열 사전식 비교).'
        - name: createdAtTo
          in: query
          required: false
          schema: { type: string }
          description: 'createdAt <= 값.'
        - name: sentAtFrom
          in: query
          required: false
          schema: { type: string }
          description: 'sentAt >= 값. sentAt이 NULL인(미송고) 행은 탈락한다.'
        - name: sentAtTo
          in: query
          required: false
          schema: { type: string }
          description: 'sentAt <= 값.'
        - name: distributedAtFrom
          in: query
          required: false
          schema: { type: string }
          description: 'distributedAt >= 값. 미배부(NULL) 행은 탈락한다.'
        - name: distributedAtTo
          in: query
          required: false
          schema: { type: string }
          description: 'distributedAt <= 값.'
      responses:
        '200':
          description: >-
            목록. 봉투는 정확히 {ok, items} 2키다(총 개수·페이지·커서 필드 없음).
            items의 각 행은 Contents 29컬럼에서 잠금 2컬럼을 뺀 **27키**이며 값이 NULL인 컬럼도
            키는 실린다(실측 키 집합: articleId, attachmentFile, attribute, author, category,
            coAuthor, content, createdAt, department, departmentCode, distributedAt, editedAt,
            embargoAt, externalComment, internalComment, keyword, lockYN, lockedAt, lockerUserId,
            modifier, referenceFile, region, secondEmbargoAt, sender, sentAt, status, title).
            잠금 보유 행도 lockYN='Y'·lockerUserId·lockedAt까지만 싣는다.
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok: { const: true }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentsRow'
        '401':
          description: 세션 없음/무효 — {ok:false, reason:'unauthenticated'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            결함 후보(실측): 스칼라 전용 필터 키를 반복해 배열이 되면 전역 에러 핸들러가
            {ok:false, reason:'internal-error'}로 응답한다. 정상 입력에서는 발생하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: articlesCreate
      tags: [articles]
      summary: 신규 기사 저장(서버가 status·부서·작성자를 stamp)
      description: >-
        세션 role이 R/D/Z여야 한다(그 밖의 role은 403 forbidden — 시드 계정이 R/D/Z 셋뿐이라
        계약 스위트로는 도달할 수 없다: **미검증 축**).
        저장되는 필드는 화이트리스트뿐이다 — Article 3키(title·markupVersion·modifier) +
        Contents 16키(title·author·modifier·department·departmentCode·embargoAt·secondEmbargoAt·
        coAuthor·category·region·attribute·keyword·internalComment·externalComment·
        attachmentFile·referenceFile). **여기 없는 필드는 400이 아니라 조용히 무시된다.**
        서버가 결정하는 것: `articleId`(AKR + YYYYMMDD + 난수 9자리 발급) ·
        `status`(초기 상태 계산) · `createdAt`. 클라가 같은 이름으로 보내도 반영되지 않는다.
        `sender`·`sentAt`·`distributedAt`·잠금 4컬럼은 화이트리스트 밖이라 저장되지 않는다(NULL 유지).
        `role`은 라우트가 delete한다.
        stamp 규칙: `department`가 비면 세션 부서·부서코드를 채우고, `author`가 비면 세션 사용자
        (name, 없으면 userId)를 채운다. **`author`를 명시하면 그 값이 보존된다**(대필 입력 —
        role/status와 달리 무시되지 않는다. "무엇이 무시되고 무엇이 존중되는가"가 계약이다).
        초기 status는 세션 role + 의도 `action`으로 서버가 계산한다:
        기본 **RDS** / `action:'hold'` + D·Z → **DDH** / `action:'hold'` + R → **RRH**.
        `action:'send'`를 보내도 DPS가 되지 않고 RDS다(송고는 전이 라우트 전용이며 배부 훅도 발화하지 않는다).
        본문 파서 limit 10mb(위 공통 4).
      security:
        - sessionCookie: []
        - sessionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreateRequest'
      responses:
        '200':
          description: 저장 완료 — 봉투는 {ok, articleId} 정확히 2키다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleCreateResponse'
        '401':
          description: 세션 없음/무효 — {ok:false, reason:'unauthenticated'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            {ok:false, reason:'forbidden'} — 세션 role이 R/D/Z 밖일 때만 도달한다.
            현행 계정 체계에 그런 role이 없어 **계약 스위트 미검증**이다(코드 경로만 존재).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            {ok:false, reason:'internal-error'} — 본문이 10mb를 넘거나 JSON이 깨졌을 때
            전역 에러 핸들러가 내는 응답이다(413·400 매핑 없음). 계약 스위트는 상한을 탐색하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/articles/search:
    x-express-path: '/api/articles/search'
    get:
      operationId: articlesSearch
      tags: [articles]
      summary: 기사 전문 검색(제목·평문·본문 LIKE)
      description: >-
        `q`를 Article.title / Article.content / Article.markupVersion 세 컬럼에 부분 일치(LIKE)로
        건다. **응답 행은 목록(Contents 27키)과 동형이 아니다** — Article 테이블 행(5키)이며
        본문(markupVersion)이 그대로 실린다. 정렬 지정이 없다(DB 반환 순서 — 순서는 계약이 아니다).
        `q` 미전달·빈 문자열은 거부가 아니라 LIKE '%%'로 **전 행 매칭**이다(400 아님).
        무매칭은 200 빈 배열이다. 형태소·대소문자·한글 정렬 동작은 DB(LIKE·collation) 의존이라
        계약에 넣지 않는다.
      security:
        - sessionCookie: []
        - sessionHeader: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: 검색어. 미전달 시 서버가 ''로 폴백한다(= 전 행 매칭).
      responses:
        '200':
          description: >-
            검색 결과. 봉투는 목록과 같은 {ok, items} 2키(총 개수 없음). 행은 Article 5키
            (articleId, content, markupVersion, modifier, title).
          content:
            application/json:
              schema:
                type: object
                required: [ok, items]
                properties:
                  ok: { const: true }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Article'
        '401':
          description: 세션 없음/무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/articles/{id}:
    x-express-path: '/api/articles/:id'
    get:
      operationId: articlesGet
      tags: [articles]
      summary: 기사 단건 조회(본문 포함)
      description: >-
        {ok, article, contents} 정확히 3키. 본문은 `article.markupVersion`이며 `contents`는
        투영(잠금 2컬럼 제거) 후의 27키다. Article 행과 Contents 행 **둘 다** 없을 때만 404다.
        읽기 전용이며 상태·잠금을 바꾸지 않는다.
      security:
        - sessionCookie: []
        - sessionHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: articleId(AKR + YYYYMMDD + 난수)
      responses:
        '200':
          description: 기사 단건(본문 포함)
          content:
            application/json:
              schema:
                type: object
                required: [ok, article, contents]
                properties:
                  ok: { const: true }
                  article:
                    $ref: '#/components/schemas/Article'
                  contents:
                    $ref: '#/components/schemas/ContentsRow'
        '401':
          description: 세션 없음/무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "{ok:false, reason:'not-found'} — 라우트 직접 매핑"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: articlesUpdate
      tags: [articles]
      summary: 기사 부분 수정(잠금 보유 탭만)
      description: >-
        세션만으로는 저장할 수 없다 — `x-edit-client`(편집 탭)가 잠금 보유 탭과 일치하고
        잠금 행의 lockerUserId가 세션 userId와 같아야 한다. 아니면 **403 not-holder**다
        (잠금 없음 · 같은 세션의 다른 탭 · 다른 사용자 · 헤더 누락 전부 같은 사유 토큰으로 수렴하며
        누가 잠갔는지는 응답에 담기지 않는다).
        **존재 검사가 잠금 검사보다 먼저다** — 없는 기사에 대한 저장은 403이 아니라 **404 not-found**다.
        저장 필드 화이트리스트는 create와 같다(Article 3키 + Contents 16키). 화이트리스트 밖
        (`status`·`sender`·`sentAt`·`distributedAt`·`articleId`·`content`·잠금 컬럼)은 조용히 무시된다.
        `role`은 삭제되고 `modifier`는 **세션 userId로 덮어쓴다**(클라가 보낸 modifier는 버려진다).
        `department` 키를 빈 값으로 보내면 세션 부서·부서코드로 보정한다.
        키가 아예 없으면 건드리지 않는다(부분 수정 — 기존 값 보존).
        `editedAt`은 서버가 매 저장마다 갱신하고, 편집 스냅샷 이력 행이 함께 쌓인다(append-only).
        응답 `changes`는 갱신된 **행 수**다 — 현행 구현에서는 Article 1행 + Contents 1행 = **2**가
        고정 관측값이다(modifier·editedAt이 항상 present라 두 테이블이 매번 갱신된다).
        본문 파서 limit 10mb(위 공통 4).
      security:
        - sessionCookie: []
        - sessionHeader: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: articleId(AKR + YYYYMMDD + 난수 9자리)
        - $ref: '#/components/parameters/EditClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleUpdateRequest'
      responses:
        '200':
          description: 저장 완료 — 봉투는 {ok, changes} 정확히 2키.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleUpdateResponse'
        '401':
          description: 세션 없음/무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            {ok:false, reason:'not-holder'} — 잠금 미보유. 탭 단위 인가라 **같은 세션의 다른 탭도 거부**다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "{ok:false, reason:'not-found'} — 기사 없음(잠금 판정보다 존재 판정이 앞선다)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            {ok:false, reason:'internal-error'} — 10mb 초과·깨진 JSON(413·400 매핑 없음).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/articles/{id}/history:
    x-express-path: '/api/articles/:id/history'
