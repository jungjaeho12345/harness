spring.application.name=server-spring

# ---------------------------------------------------------------------------
# 값은 전부 OS 환경변수에서 온다. 절대경로(리포 경로 / web/dist / news.db)를 여기에 하드코딩하지 않는다 —
# 하드코딩하면 계약 하네스가 프로파일별 임시 DATA_DIR을 주입할 수 없고 리포 news.db를 여는 사고로 직행한다.
# 키 <-> 환경변수 대응표는 README.md 참조.
# ---------------------------------------------------------------------------

# 바인드 — 기본 127.0.0.1(Node 서버와 동일 규율: HOST 명시 설정 시에만 LAN에 열린다).
# 계약 하네스(step1)는 [15000,20000)에서 빈 포트를 실제 listen 프로브로 잡아 PORT로 주입한다.
server.port=${PORT:15000}
server.address=${HOST:127.0.0.1}

# X-Forwarded-* 를 신뢰하지 않는다(명시). CSRF 자기 출처 판정과 클라이언트 IP는 요청 라인/Host 헤더에서만
# 나온다 — 프록시 헤더를 믿으면 헤더 한 줄로 CSRF 게이트가 우회된다(ADR-009, server/index.js의 CRITICAL 주석).
# TLS 종단 프록시 뒤에 두는 배포는 ALLOWED_ORIGINS 로 출처를 명시 등록한다.
server.forward-headers-strategy=none

# 데이터 디렉토리(필수). 빈 값이면 기동을 거부한다 — AppProperties 참조.
app.data-dir=${DATA_DIR:}
# production 이면 프로덕션 분기(쿠키 Secure·SameSite=None, CSRF allowlist 엄격).
app.env=${APP_ENV:development}
# CORS allowlist — 콤마 구분, 기본 빈 목록.
app.allowed-origins=${ALLOWED_ORIGINS:}

# 수집 인제스트 fail-closed 판정의 두 입력(CollectionProperties 참조).
# host는 반드시 server.address에서 파생한다 — ${HOST:...}를 한 벌 더 쓰면 출처가 둘이 되어
# SERVER_ADDRESS만 설정된 배포에서 Tomcat은 전 인터페이스에 열리는데 판정만 127.0.0.1로 남아
# 수집 2라우트가 무토큰으로 개방된다(fail-closed가 막으려던 바로 그 상태).
app.collection.host=${server.address:127.0.0.1}
# 수집 토큰. 빈 값 = 미설정이며, 비-loopback 바인딩 + 미설정이면 수집 2라우트는 503이다.
app.collection.token=${COLLECTION_TOKEN:}

# 배부 스풀 루트(ADR-008 (1) — 파일 스풀 outbound). 미설정 = 배부 전면 비활성이다.
# 기본값을 하드코딩하지 않는다: 경로를 추정하면 설정이 없는 배포가 조용히 어딘가에 파일을 쓴다
# (cwd·DATA_DIR 하위 추정 금지 — SpoolProperties 참조). 디렉토리 생성은 SpoolWriter가 쓰기 직전에 한다.
app.distribution.spool-dir=${DIST_SPOOL_DIR:}

# 미디어 검색 프록시가 쓰는 서버 보유 API 키(ADR-014 · MediaProperties 참조). 값은 OS 환경변수에서만 온다 —
# 실제 키를 여기 적으면 리포에 커밋된다. 미설정(빈 값)이면 외부 호출을 아예 하지 않고 결정적 데모 폴백이며,
# 계약 하네스는 자식 프로세스 env에서 이 키들을 지우므로 계약이 관측하는 것은 언제나 그 폴백 경로다.
# 이미지(Google CSE)는 키와 엔진 id가 둘 다 있어야 열리고, 영상(YouTube)은 키 하나면 열린다.
app.media.google-api-key=${GOOGLE_API_KEY:}
app.media.google-cse-id=${GOOGLE_CSE_ID:}
app.media.youtube-api-key=${YOUTUBE_API_KEY:}

# 번역 프록시가 쓰는 서버 보유 API 키(ADR-014 · TranslateProperties 참조). 값은 OS 환경변수에서만 온다.
# 미설정(빈 값)이면 외부 호출을 아예 하지 않고 200 + {ok:false, reason:no-key} + 원문 폴백이다(4xx/5xx가 아니다).
# 계약 하네스는 자식 프로세스 env에서 이 키를 지우므로 계약이 관측하는 것은 언제나 그 no-key 경로다.
app.translate.google-api-key=${GOOGLE_TRANSLATE_API_KEY:}
