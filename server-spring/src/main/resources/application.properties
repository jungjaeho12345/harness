spring.application.name=server-spring
# 런타임 구성은 계약 하네스(scripts/contract-run-spring.mjs)가 커맨드라인 인자로 주입한다:
#   --app.db-path=<임시 시드 news.db>  (읽기·쓰기, 리포 원본 news.db 무접촉)
#   --app.prod-cookie=true|false        (세션 쿠키 속성 모드: true=Secure+SameSite=None, false=SameSite=Lax)
#   --server.port=<빈 포트> --server.address=127.0.0.1
# 여기에는 절대 경로/비밀을 하드코딩하지 않는다(DB 비파괴·이식성).
app.prod-cookie=false
